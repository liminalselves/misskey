name: Publish Docker image

on:
  push:
    tags:
      - 'release-v*-liminalselves.*'
  workflow_dispatch:
    inputs:
      no_cache:
        description: '禁用构建缓存强制全量重建（修复 GHA 缓存导致镜像不更新）'
        type: boolean
        default: false

env:
  # Fork convention: publish to GHCR (ghcr.io/<owner>/<repo>), not the upstream misskey/misskey Docker Hub repository.
  # ACR's built-in release-v$version rule publishes the version without the release-v prefix.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  check:
    name: Check release tag and version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - name: Verify the release tag, master ancestry and package versions
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [[ ! "$RELEASE_TAG" =~ ^release-v[0-9]{4}\.[0-9]{1,2}\.[0-9]+-liminalselves\.[1-9][0-9]*$ ]]; then
            echo "::error::Select a release-v<upstream-baseline>-liminalselves.<N> tag; branch builds are not allowed"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::The tagged commit is not on master; refusing to build"
            exit 1
          fi
          export RELEASE_VERSION="${RELEASE_TAG#release-v}"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['package.json', 'packages/misskey-js/package.json']) {
            const { version } = JSON.parse(readFileSync(path, 'utf8'));
            if (version !== process.env.RELEASE_VERSION) {
              console.error(`::error::${path} version ${version} does not match release version ${process.env.RELEASE_VERSION}`);
              process.exit(1);
            }
          }
          NODE
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  # see https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    name: Build
    needs:
      - check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          # Lowercase registry image name (GHCR requires lowercase)
          echo "REGISTRY_IMAGE=${REGISTRY_IMAGE,,}" >> $GITHUB_ENV
      - name: Check out the repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.check.outputs.version }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push to GitHub Container Registry
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache || false }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - check
      - build
    steps:
      - name: Prepare
        run: |
          # Lowercase registry image name (GHCR requires lowercase)
          echo "REGISTRY_IMAGE=${REGISTRY_IMAGE,,}" >> $GITHUB_ENV
      - name: Download digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.check.outputs.version }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
