name: Sync GHCR image to Tencent TCR

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'locales/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  packages: read

env:
  SOURCE_IMAGE: ghcr.io/${{ github.repository }}:develop
  TARGET_IMAGE: ccr.ccs.tencentyun.com/w573/yjrg:develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize image names to lowercase
        run: |
          echo "SOURCE_IMAGE=${SOURCE_IMAGE,,}" >> $GITHUB_ENV
          echo "TARGET_IMAGE=${TARGET_IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Copy develop image from GHCR to TCR
        run: |
          docker buildx imagetools create \
            --tag ${{ env.TARGET_IMAGE }} \
            ${{ env.SOURCE_IMAGE }}

      - name: Inspect copied image
        run: |
          docker buildx imagetools inspect ${{ env.TARGET_IMAGE }}
